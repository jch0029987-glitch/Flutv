name: flutv
description: "A custom Android TV launcher built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  path_provider: ^2.1.2
  flutter_android_package_installer: ^0.0.3+2
  open_filex: ^4.4.0
  shared_preferences: ^2.2.3 # Required for saving wallpaper settings
  shelf: ^1.4.1              # Required for local web dashboard server
  shelf_router: ^1.1.4        # Required for web dashboard routing

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Register your assets folder for custom banners or fallbacks
