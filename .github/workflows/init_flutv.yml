name: Initialize flutv Structure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'template/**'

jobs:
  scaffold:
    name: Scaffold Project from Templates
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Create Flutter Project Skeleton
        run: |
          flutter create . --org com.flutv --project-name flutv --empty

      - name: Overlay Template Files
        run: |
          # Copy template assets over the standard flutter scaffolding
          if [ -d "template" ]; then
            cp -r template/* .
          fi

      - name: Commit and Push Scaffolding
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || {
            git commit -m "chore: apply flutv template structure"
            git push origin main
          }
