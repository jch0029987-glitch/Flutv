<!DOCTYPE html>
<html>
<head>
    <title>Flutv Remote Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { 
            background: #121212; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container { 
            width: 100%; 
            max-width: 400px; 
            background: #1e1e1e; 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
            box-sizing: border-box;
        }
        h2 { 
            color: #3b82f6; 
            text-align: center; 
            margin-top: 0;
            font-size: 24px;
        }
        p {
            text-align: center; 
            color: #9ca3af; 
            font-size: 14px;
            margin-bottom: 24px;
        }
        label {
            font-size: 14px;
            font-weight: 600;
            color: #d1d5db;
        }
        input { 
            width: 100%; 
            padding: 14px; 
            margin: 8px 0 16px 0; 
            background: #2a2a2a; 
            border: 1px solid #374151; 
            color: #fff; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 15px;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #3b82f6; 
            color: #fff; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 16px;
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:hover { 
            background: #2563eb; 
        }
        #msg { 
            margin-top: 16px; 
            text-align: center; 
            color: #34d399; 
            font-size: 14px; 
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Flutv Remote</h2>
        <p>Android TV Web Management Panel</p>
        
        <label for="wallpaperInput">Custom Wallpaper URL:</label>
        <input type="text" id="wallpaperInput" placeholder="https://example.com/background.jpg">
        <button onclick="saveWallpaper()">Save Wallpaper</button>
        
        <div id="msg"></div>
    </div>

    <script>
        async function saveWallpaper() {
            const url = document.getElementById('wallpaperInput').value;
            const msgEl = document.getElementById('msg');
            msgEl.style.color = '#9ca3af';
            msgEl.innerText = 'Saving...';

            try {
                const response = await fetch('/api/wallpaper', {
                    method: 'POST',
                    body: 'url=' + encodeURIComponent(url),
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                
                if (response.ok) {
                    const text = await response.text();
                    msgEl.style.color = '#34d399';
                    msgEl.innerText = text;
                } else {
                    msgEl.style.color = '#f87171';
                    msgEl.innerText = 'Failed to update wallpaper.';
                }
            } catch (err) {
                msgEl.style.color = '#f87171';
                msgEl.innerText = 'Network error occurred.';
            }
        }
    </script>
</body>
</html>
